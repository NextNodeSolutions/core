name: Monitoring

on:
    workflow_dispatch:
    push:
        branches: [main]
        paths: ['packages/monitoring/**']

env:
    # Infisical machine identity the pipeline logs in as through GitHub OIDC -
    # the vault holds every secret, GitHub none. Org-level Variable (an id, not
    # a credential).
    INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}

jobs:
    pipeline:
        uses: ./.github/workflows/deploy.yml
        with:
            config_file: packages/monitoring/nextnode.toml
            environment: production
        secrets: inherit

    # After the observability stack is up, ensure the tailnet ACL grants the
    # monitoring scrape (exporters) + Vector log push over the default-deny
    # tailnet. Idempotent + non-fatal: it warns and exits 0 if the OAuth client
    # lacks the `acl` scope, so it never blocks a deploy.
    reconcile-acl:
        name: Reconcile tailnet ACL
        needs: pipeline
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: NextNodeSolutions/core/.github/actions/setup@main
              with:
                  infra: 'true'
                  deps: 'false'

            - name: Load secrets
              id: vault
              run: node src/index.ts load-secrets
              working-directory: .infra/packages/infrastructure

            - name: Reconcile tailnet ACL
              run: node src/index.ts reconcile-tailnet-acl
              working-directory: .infra/packages/infrastructure
              env:
                  TAILSCALE_AUTH_KEY: ${{ steps.vault.outputs.TS_OAUTH_SECRET }}
