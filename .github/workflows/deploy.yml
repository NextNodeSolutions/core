name: Deploy

on:
    workflow_call:
        inputs:
            environment:
                type: string
                required: true
                description: 'development or production'
            config_file:
                type: string
                default: 'nextnode.toml'
                description: 'Path to nextnode.toml in the calling repo'
            dev_workflow_file:
                type: string
                default: 'deploy-dev.yml'
                description: 'Filename of the dev workflow (for prod gate)'

permissions:
    contents: read
    actions: read

env:
    # The CI project in Infisical, and the machine identity this workflow logs
    # in as through GitHub OIDC. Organization Variables: ids,
    # not credentials (README, "Vault setup").
    INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
    INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}

# Serialise deploys per (config, environment). Two pushes to the same
# project's environment queue rather than racing - protects the shared
# Terraform workspace state and the D1 migration roundtrip from concurrent
# runs (Terraform holds its own lock, but serialising here avoids a run
# failing on a held lock instead of queueing).
concurrency:
    group: deploy-${{ inputs.config_file }}-${{ inputs.environment }}
    cancel-in-progress: false

# Trust boundary. A job granted `id-token: write` can mint an OIDC token from
# any of its steps, and the vault accepts that token. Such a job therefore runs
# core's pipeline CLI only, never the caller's scripts or dependency lifecycle
# hooks: the caller's code builds in `build`, with no credential and no token
# endpoint, and `deploy` ships the uploaded result. A container service's
# Dockerfile builds in `containers` on the same terms; `deploy` loads and pushes
# the saved image without building. The one exception is a PlanetScale
# migration, which runs the caller's migrate command in `migrate`.
#
# Shape: `plan` reads nextnode.toml, then everything that needs no other job
# runs at once - the caller's checks, its build, its container images and
# the provisioning - and `deploy` waits for all of them. A production deploy
# first passes `gate`, which the provisioning waits for.
jobs:
    plan:
        name: Plan
        runs-on: ubuntu-latest
        timeout-minutes: 30
        outputs:
            quality_matrix: ${{ steps.plan.outputs.quality_matrix }}
            project_name: ${{ steps.plan.outputs.project_name }}
            has_prod_gate: ${{ steps.plan.outputs.has_prod_gate }}
            has_domain: ${{ steps.plan.outputs.has_domain }}
            has_migrations: ${{ steps.plan.outputs.has_migrations }}
            has_planetscale_migration: ${{ steps.plan.outputs.has_planetscale_migration }}
            has_containers: ${{ steps.plan.outputs.has_containers }}
            containers_matrix: ${{ steps.plan.outputs.containers_matrix }}
            package_dir: ${{ steps.plan.outputs.package_dir }}
            config_name: ${{ steps.plan.outputs.config_name }}
        steps:
            - uses: NextNodeSolutions/core/.github/actions/setup@main
              with:
                  infra: 'true'
                  deps: 'false'

            - name: Plan pipeline
              id: plan
              run: node src/index.ts plan
              working-directory: .infra/packages/infrastructure
              env:
                  PIPELINE_CONFIG_FILE: ${{ github.workspace }}/${{ inputs.config_file }}
                  PIPELINE_ENVIRONMENT: ${{ inputs.environment }}

    quality:
        name: ${{ matrix.task.name }}
        needs: plan
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                task: ${{ fromJSON(needs.plan.outputs.quality_matrix) }}
        # A project script (lint, test) runs in the caller's clean tree: core
        # is not checked out here, so a caller lint cannot scan core's own
        # sources and fail on core's lint rules.
        steps:
            - uses: NextNodeSolutions/core/.github/actions/setup@main

            - name: ${{ matrix.task.name }}
              run: ${{ matrix.task.cmd }}

    gate:
        name: Production gate
        needs: plan
        # A production deploy of a project with a development environment
        # ships a commit only once the same commit deployed to development.
        # The gate is its own job so that the provisioning, which changes
        # production, waits for it and for nothing else.
        if: needs.plan.outputs.has_prod_gate == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: NextNodeSolutions/core/.github/actions/setup@main
              with:
                  infra: 'true'
                  deps: 'false'

            - name: Check the development deploy of this commit
              run: node src/index.ts prod-gate
              working-directory: .infra/packages/infrastructure
              env:
                  GH_TOKEN: ${{ github.token }}
                  DEV_WORKFLOW_FILE: ${{ inputs.dev_workflow_file }}

    build:
        name: Build
        needs: plan
        runs-on: ubuntu-latest
        timeout-minutes: 30
        # The caller's dependencies install and its build runs here, with no
        # `id-token: write` and no secret: nothing this job executes can reach
        # the vault. The package directory, minus its dependencies, travels to
        # `deploy` as an artifact; the Worker bundle must be self-contained,
        # `deploy` never installs the caller's dependencies.
        steps:
            - uses: NextNodeSolutions/core/.github/actions/setup@main

            # Public settings only: a DSN is not a secret.
            - name: Build
              run: pnpm build
              env:
                  PUBLIC_SENTRY_DSN: ${{ vars.PUBLIC_SENTRY_DSN }}
                  PUBLIC_SENTRY_ENVIRONMENT: ${{ inputs.environment }}
                  SENTRY_RELEASE: ${{ github.sha }}

            - name: Upload build
              uses: actions/upload-artifact@v7
              with:
                  name: build-${{ needs.plan.outputs.project_name }}-${{ inputs.environment }}
                  path: |
                      ${{ needs.plan.outputs.package_dir || '.' }}
                      !**/node_modules/**
                      !**/.git/**
                  include-hidden-files: true
                  if-no-files-found: error
                  retention-days: 1

    containers:
        name: Container ${{ matrix.container.service }}
        needs: plan
        if: needs.plan.outputs.has_containers == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                container: ${{ fromJSON(needs.plan.outputs.containers_matrix) }}
        # Builds one container service's image from the caller's Dockerfile,
        # which runs arbitrary caller code: like `build`, this job has no
        # `id-token: write` and no secret, so nothing it executes can reach the
        # vault. Each service builds in its own job, with its layers cached in
        # the Actions cache under its own scope, so a commit that leaves a
        # build stage unchanged restores it instead of rebuilding it. The
        # archive travels to `deploy`, which pushes it with the Cloudflare
        # token and never builds.
        steps:
            - uses: actions/checkout@v6

            - uses: docker/setup-buildx-action@v4

            - name: Prepare the archive directory
              run: mkdir -p "$RUNNER_TEMP/containers"

            # The tag is the one `deploy` pushes: the image repository is the
            # service's Worker script name, the tag the commit. `provenance`
            # off keeps the output a plain image that `docker load` restores.
            - name: Build image
              uses: docker/build-push-action@v7
              with:
                  context: ${{ matrix.container.context }}
                  file: ${{ matrix.container.dockerfile }}
                  platforms: linux/amd64
                  provenance: false
                  tags: ${{ matrix.container.repository }}:${{ github.sha }}
                  outputs: type=docker,dest=${{ runner.temp }}/containers/${{ matrix.container.archive }}
                  cache-from: type=gha,scope=${{ matrix.container.repository }}
                  cache-to: type=gha,scope=${{ matrix.container.repository }},mode=max

            # An image archive is mostly already-compressed layers: the
            # lightest compression keeps the upload short.
            - name: Upload image
              uses: actions/upload-artifact@v7
              with:
                  name: containers-${{ needs.plan.outputs.project_name }}-${{ inputs.environment }}--${{ matrix.container.service }}
                  path: ${{ runner.temp }}/containers/${{ matrix.container.archive }}
                  compression-level: 1
                  if-no-files-found: error
                  retention-days: 1

    provision:
        name: Provision
        # A skipped gate (no production gate) does not block the provisioning;
        # a failed one does.
        needs: [plan, gate]
        if: ${{ !cancelled() && !failure() }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            actions: read
            id-token: write
        # `environment:` ties the job to the GitHub environment, for deployment
        # tracking and any protection rule set on it, before infrastructure
        # changes.
        environment:
            name: ${{ inputs.environment }}
        steps:
            - uses: NextNodeSolutions/core/.github/actions/setup@main
              with:
                  infra: 'true'
                  deps: 'false'

            # Platform credentials only: provision never touches a Worker's
            # secrets.
            - name: Load secrets
              id: vault
              run: node src/index.ts load-secrets
              working-directory: .infra/packages/infrastructure

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v4.0.1
              with:
                  terraform_version: '~> 1.9'
                  terraform_wrapper: false

            - name: Provision infrastructure
              id: provision
              run: node src/index.ts provision
              working-directory: .infra/packages/infrastructure
              env:
                  PLANETSCALE_SERVICE_TOKEN_ID: ${{ steps.vault.outputs.PLANETSCALE_SERVICE_TOKEN_ID }}
                  PLANETSCALE_SERVICE_TOKEN: ${{ steps.vault.outputs.PLANETSCALE_SERVICE_TOKEN }}
                  PIPELINE_CONFIG_FILE: ${{ github.workspace }}/${{ inputs.config_file }}
                  PIPELINE_ENVIRONMENT: ${{ inputs.environment }}
                  CLOUDFLARE_API_TOKEN: ${{ steps.vault.outputs.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ steps.vault.outputs.CLOUDFLARE_ACCOUNT_ID }}
                  TF_TOKEN_app_terraform_io: ${{ steps.vault.outputs.TF_CLOUD_TOKEN }}
                  TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
                  PLANETSCALE_ORGANIZATION: ${{ vars.PLANETSCALE_ORGANIZATION }}
                  COMPANY_DOMAIN: ${{ vars.COMPANY_DOMAIN }}
                  ACCESS_SESSION_DURATION: ${{ vars.ACCESS_SESSION_DURATION }}

    migrate:
        name: Migrate
        needs: [plan, provision]
        # Applies pending D1 migrations whenever the project declares
        # `[services.d1]`. `wrangler d1 migrations apply --remote` is idempotent -
        # it lists the remote `d1_migrations` table and applies only what is
        # pending, so running it every deploy is a no-op when the schema is
        # current. No git-diff gating: the deployed D1 (which a provision can
        # recreate empty) is the source of truth, not the push's file diff.
        # A PlanetScale project runs its migrate command, unless it declares
        # `migrate_command = false`; then this job is skipped.
        if: ${{ !cancelled() && !failure() && needs.plan.outputs.has_migrations == 'true' }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            actions: read
            id-token: write
        environment:
            name: ${{ inputs.environment }}
        steps:
            - uses: NextNodeSolutions/core/.github/actions/setup@main
              with:
                  infra: 'true'
                  # D1 migrations are SQL files applied by wrangler: no caller
                  # dependency runs. A PlanetScale migration is the caller's
                  # own command and needs them - the one place caller code
                  # runs with vault access.
                  deps: ${{ needs.plan.outputs.has_planetscale_migration }}

            # Platform credentials only: a migration reads the database
            # credentials from the Terraform outputs, not from the vault.
            - name: Load secrets
              id: vault
              run: node src/index.ts load-secrets
              working-directory: .infra/packages/infrastructure

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v4.0.1
              with:
                  terraform_version: '~> 1.9'
                  terraform_wrapper: false

            - name: Migrate remote
              run: node src/index.ts migrate-remote
              working-directory: .infra/packages/infrastructure
              env:
                  PLANETSCALE_SERVICE_TOKEN_ID: ${{ steps.vault.outputs.PLANETSCALE_SERVICE_TOKEN_ID }}
                  PLANETSCALE_SERVICE_TOKEN: ${{ steps.vault.outputs.PLANETSCALE_SERVICE_TOKEN }}
                  PIPELINE_CONFIG_FILE: ${{ github.workspace }}/${{ inputs.config_file }}
                  PIPELINE_ENVIRONMENT: ${{ inputs.environment }}
                  CLOUDFLARE_API_TOKEN: ${{ steps.vault.outputs.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ steps.vault.outputs.CLOUDFLARE_ACCOUNT_ID }}
                  TF_TOKEN_app_terraform_io: ${{ steps.vault.outputs.TF_CLOUD_TOKEN }}
                  TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
                  PLANETSCALE_ORGANIZATION: ${{ vars.PLANETSCALE_ORGANIZATION }}
                  COMPANY_DOMAIN: ${{ vars.COMPANY_DOMAIN }}
                  ACCESS_SESSION_DURATION: ${{ vars.ACCESS_SESSION_DURATION }}

    deploy:
        name: Deploy
        # A skipped `gate`, `containers` or `migrate` job is neither cancelled
        # nor failed, so it does not block the deploy; a failed one does.
        needs: [plan, quality, gate, build, containers, provision, migrate]
        if: ${{ !cancelled() && !failure() }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            actions: read
            id-token: write
        environment:
            name: ${{ inputs.environment }}
        steps:
            - uses: NextNodeSolutions/core/.github/actions/setup@main
              with:
                  infra: 'true'
                  deps: 'false'

            # The package directory built in `build`, extracted outside the
            # checkout: laid over the workspace, a caller's artifact could
            # replace core's CLI under `.infra` before the steps below run it
            # with vault access. The deploy reads the project from here. No
            # caller dependency is installed (see the trust boundary above).
            - name: Download build
              uses: actions/download-artifact@v8
              with:
                  name: build-${{ needs.plan.outputs.project_name }}-${{ inputs.environment }}
                  path: ${{ runner.temp }}/build

            # The image archives saved by `containers`, one artifact per
            # service, merged into one directory outside the checkout for the
            # same reason. `deploy` only loads and pushes them: no Dockerfile
            # step runs in this job.
            - name: Download container images
              if: needs.plan.outputs.has_containers == 'true'
              uses: actions/download-artifact@v8
              with:
                  pattern: containers-${{ needs.plan.outputs.project_name }}-${{ inputs.environment }}--*
                  merge-multiple: true
                  path: ${{ runner.temp }}/containers

            # Platform credentials, plus the repository's Infisical project for
            # this environment: every secret in it is synced to each Worker.
            - name: Load secrets
              id: vault
              run: node src/index.ts load-secrets
              working-directory: .infra/packages/infrastructure
              env:
                  PIPELINE_ENVIRONMENT: ${{ inputs.environment }}

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v4.0.1
              with:
                  terraform_version: '~> 1.9'
                  terraform_wrapper: false

            # The SEO guard is injected per service inside `deploy` (before each
            # asset upload), so there is no separate seo-guard step here. A
            # container service loads its archive from CONTAINER_IMAGES_DIR and
            # pushes it as IMAGE_TAG with `wrangler containers push`, which
            # logs in to the registry with the Cloudflare token: no Docker login
            # step. Both are left empty for a project without containers.
            # DEPLOY_ID tells a re-run of the same commit from the previous one:
            # the gateway answers the health check with the release, and the
            # smoke check accepts only this run's.
            - name: Deploy
              run: node src/index.ts deploy
              working-directory: .infra/packages/infrastructure
              env:
                  PLANETSCALE_SERVICE_TOKEN_ID: ${{ steps.vault.outputs.PLANETSCALE_SERVICE_TOKEN_ID }}
                  PLANETSCALE_SERVICE_TOKEN: ${{ steps.vault.outputs.PLANETSCALE_SERVICE_TOKEN }}
                  PIPELINE_CONFIG_FILE: ${{ runner.temp }}/build/${{ needs.plan.outputs.config_name }}
                  PIPELINE_ENVIRONMENT: ${{ inputs.environment }}
                  CLOUDFLARE_API_TOKEN: ${{ steps.vault.outputs.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ steps.vault.outputs.CLOUDFLARE_ACCOUNT_ID }}
                  TF_TOKEN_app_terraform_io: ${{ steps.vault.outputs.TF_CLOUD_TOKEN }}
                  TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
                  PLANETSCALE_ORGANIZATION: ${{ vars.PLANETSCALE_ORGANIZATION }}
                  COMPANY_DOMAIN: ${{ vars.COMPANY_DOMAIN }}
                  ACCESS_SESSION_DURATION: ${{ vars.ACCESS_SESSION_DURATION }}
                  PROJECT_SECRETS: ${{ steps.vault.outputs.PROJECT_SECRETS }}
                  CONTAINER_IMAGES_DIR: ${{ needs.plan.outputs.has_containers == 'true' && format('{0}/containers', runner.temp) || '' }}
                  IMAGE_TAG: ${{ needs.plan.outputs.has_containers == 'true' && github.sha || '' }}
                  DEPLOY_ID: ${{ github.run_id }}-${{ github.run_attempt }}
