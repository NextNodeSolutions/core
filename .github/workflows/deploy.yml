name: Deploy

on:
    workflow_call:
        inputs:
            environment:
                type: string
                required: true
                description: 'development or production'
            config_file:
                type: string
                default: 'nextnode.toml'
                description: 'Path to nextnode.toml in the calling repo'
            dev_workflow_file:
                type: string
                default: 'deploy-dev.yml'
                description: 'Filename of the dev workflow (for prod gate)'

permissions:
    contents: read
    actions: read
    packages: write

# Serialise deploys per (config, environment). Two pushes to the same
# project's environment queue rather than racing — protects DB migrations
# and traffic swap from concurrent runs without needing a Postgres
# advisory lock in the migrate command.
concurrency:
    group: deploy-${{ inputs.config_file }}-${{ inputs.environment }}
    cancel-in-progress: false

jobs:
    plan:
        name: Plan
        runs-on: ubuntu-latest
        outputs:
            quality_matrix: ${{ steps.plan.outputs.quality_matrix }}
            project_name: ${{ steps.plan.outputs.project_name }}
            has_prod_gate: ${{ steps.plan.outputs.has_prod_gate }}
            has_domain: ${{ steps.plan.outputs.has_domain }}
            has_postgres: ${{ steps.plan.outputs.has_postgres }}
            package_dir: ${{ steps.plan.outputs.package_dir }}
            image_source: ${{ steps.plan.outputs.image_source }}
            upstream_image_refs: ${{ steps.plan.outputs.upstream_image_refs }}
        steps:
            - uses: NextNodeSolutions/core/.github/actions/setup@main
              with:
                  infra: 'true'
                  deps: 'false'

            - name: Plan pipeline
              id: plan
              run: node src/index.ts plan
              working-directory: .infra/packages/infrastructure
              env:
                  PIPELINE_CONFIG_FILE: ${{ github.workspace }}/${{ inputs.config_file }}
                  PIPELINE_ENVIRONMENT: ${{ inputs.environment }}

    quality:
        name: ${{ matrix.task.name }}
        needs: plan
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                task: ${{ fromJSON(needs.plan.outputs.quality_matrix) }}
        steps:
            - uses: NextNodeSolutions/core/.github/actions/setup@main
              with:
                  infra: ${{ needs.plan.outputs.has_prod_gate }}

            - name: ${{ matrix.task.name }}
              run: ${{ matrix.task.cmd }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  DEV_WORKFLOW_FILE: ${{ inputs.dev_workflow_file }}

    provision:
        name: Provision
        needs: [plan, quality]
        runs-on: ubuntu-latest
        steps:
            - uses: NextNodeSolutions/core/.github/actions/setup@main
              with:
                  infra: 'true'
                  deps: 'false'

            - name: Connect runner to tailnet
              uses: tailscale/github-action@v4
              with:
                  oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
                  oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
                  tags: tag:ci

            - name: Generate GitHub App token
              id: app-token
              uses: actions/create-github-app-token@v2
              with:
                  app-id: ${{ secrets.NEXTNODE_APP_ID }}
                  private-key: ${{ secrets.NEXTNODE_APP_PRIVATE_KEY }}
                  owner: NextNodeSolutions

            - name: Provision VPS
              id: provision
              run: node src/index.ts provision
              working-directory: .infra/packages/infrastructure
              env:
                  PIPELINE_CONFIG_FILE: ${{ github.workspace }}/${{ inputs.config_file }}
                  PIPELINE_ENVIRONMENT: ${{ inputs.environment }}
                  HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
                  DEPLOY_SSH_PRIVATE_KEY_B64: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY_B64 }}
                  TAILSCALE_AUTH_KEY: ${{ secrets.TS_OAUTH_SECRET }}
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}

    dns:
        name: DNS
        needs: [plan, quality, provision]
        if: needs.plan.outputs.has_domain == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: NextNodeSolutions/core/.github/actions/setup@main
              with:
                  infra: 'true'
                  deps: 'false'

            - name: Reconcile DNS
              run: node src/index.ts dns
              working-directory: .infra/packages/infrastructure
              env:
                  PIPELINE_CONFIG_FILE: ${{ github.workspace }}/${{ inputs.config_file }}
                  PIPELINE_ENVIRONMENT: ${{ inputs.environment }}
                  HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
                  DEPLOY_SSH_PRIVATE_KEY_B64: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY_B64 }}
                  TAILSCALE_AUTH_KEY: ${{ secrets.TS_OAUTH_SECRET }}
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

    build-image:
        name: Build image
        needs: [plan, quality]
        if: needs.plan.outputs.image_source == 'build'
        env:
            PACKAGE_DIR: ${{ needs.plan.outputs.package_dir }}
        runs-on: ubuntu-latest
        outputs:
            image_refs: ${{ steps.compute.outputs.image_refs }}
            bake_file: ${{ steps.compute.outputs.bake_file }}
        steps:
            - uses: NextNodeSolutions/core/.github/actions/setup@main
              with:
                  infra: 'true'
                  deps: 'false'

            - uses: docker/setup-buildx-action@v3

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Render bake definition from nextnode.toml
              id: compute
              run: node src/index.ts compute-image-ref
              working-directory: .infra/packages/infrastructure
              env:
                  PIPELINE_CONFIG_FILE: ${{ github.workspace }}/${{ inputs.config_file }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  GITHUB_SHA: ${{ github.sha }}

            - name: Build and push
              uses: docker/bake-action@v6
              with:
                  # Bake from the workspace (where the compute step wrote
                  # docker-bake.json), not bake-action v6's default Git context
                  # which ignores runtime-generated files. `.` is the build context.
                  source: .
                  files: ${{ steps.compute.outputs.bake_file }}
                  push: true

    migrate:
        name: Migrate
        needs: [plan, provision, build-image]
        # Path A: postgres healthy → migrate → app rotation. Skipped when
        # the project has no `[services.postgres]` so the cost (one
        # ephemeral container roundtrip on the VPS) is only paid where
        # a schema actually exists.
        if: ${{ !cancelled() && !failure() && needs.plan.outputs.has_postgres == 'true' }}
        runs-on: ubuntu-latest
        steps:
            - uses: NextNodeSolutions/core/.github/actions/setup@main
              with:
                  infra: 'true'
                  deps: 'false'

            - name: Connect runner to tailnet
              uses: tailscale/github-action@v4
              with:
                  oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
                  oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
                  tags: tag:ci

            - name: Migrate remote
              run: node src/index.ts migrate-remote
              working-directory: .infra/packages/infrastructure
              env:
                  PIPELINE_CONFIG_FILE: ${{ github.workspace }}/${{ inputs.config_file }}
                  PIPELINE_ENVIRONMENT: ${{ inputs.environment }}
                  HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
                  DEPLOY_SSH_PRIVATE_KEY_B64: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY_B64 }}
                  TAILSCALE_AUTH_KEY: ${{ secrets.TS_OAUTH_SECRET }}
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
                  IMAGE_REFS: ${{ needs.build-image.outputs.image_refs || needs.plan.outputs.upstream_image_refs }}
                  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  ALL_SECRETS: ${{ toJSON(secrets) }}

    deploy:
        name: Deploy
        needs: [plan, provision, build-image, migrate]
        if: ${{ !cancelled() && !failure() }}
        runs-on: ubuntu-latest
        environment:
            name: ${{ inputs.environment }}
        steps:
            - uses: NextNodeSolutions/core/.github/actions/setup@main
              with:
                  infra: 'true'
                  deps: 'false'

            - name: Connect runner to tailnet
              uses: tailscale/github-action@v4
              with:
                  oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
                  oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
                  tags: tag:ci

            - name: Deploy
              run: node src/index.ts deploy
              working-directory: .infra/packages/infrastructure
              env:
                  PIPELINE_CONFIG_FILE: ${{ github.workspace }}/${{ inputs.config_file }}
                  PIPELINE_ENVIRONMENT: ${{ inputs.environment }}
                  HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
                  DEPLOY_SSH_PRIVATE_KEY_B64: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY_B64 }}
                  TAILSCALE_AUTH_KEY: ${{ secrets.TS_OAUTH_SECRET }}
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
                  IMAGE_REFS: ${{ needs.build-image.outputs.image_refs || needs.plan.outputs.upstream_image_refs }}
                  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  ALL_SECRETS: ${{ toJSON(secrets) }}
