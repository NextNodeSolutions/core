name: Verify Worker Types

# Drift-guard for a Cloudflare Workers project's committed
# `worker-configuration.d.ts` files, meant to run on pull requests so a stale
# (or missing) generated type file is caught BEFORE merge instead of failing the
# deploy pipeline after merge. Regenerates the types from `nextnode.toml` (infra
# IS checked out here) and fails on any diff.
#
# This is the same check `deploy-workers.yml` runs in its `plan` job; extracting
# it lets a caller wire it as a lightweight PR gate without deploying:
#
#   on:
#     pull_request:
#   jobs:
#     verify-worker-types:
#       uses: NextNodeSolutions/core/.github/workflows/verify-worker-types.yml@main
#
# Pure config -> types generation: no cloud call, no secret, no environment.

on:
    workflow_call:
        inputs:
            config_file:
                type: string
                default: 'nextnode.toml'
                description: 'Path to nextnode.toml in the calling repo'

permissions:
    contents: read

jobs:
    verify-worker-types:
        name: Verify worker types
        runs-on: ubuntu-latest
        steps:
            - uses: NextNodeSolutions/core/.github/actions/setup@main
              with:
                  infra: 'true'
                  deps: 'false'

            # The generated worker-configuration.d.ts is committed in the caller
            # repo so `astro check`/`astro build` and every developer typecheck
            # see `interface Env`. Regenerate from nextnode.toml here (infra IS
            # checked out) and fail on any diff, so a stale committed file cannot
            # reach main.
            - name: Generate worker types
              run: node src/index.ts generate-worker-types
              working-directory: .infra/packages/infrastructure
              env:
                  PIPELINE_CONFIG_FILE: ${{ github.workspace }}/${{ inputs.config_file }}

            # `--intent-to-add` surfaces a never-committed file as a diff too, so
            # a missing worker-configuration.d.ts fails like a stale one.
            - name: Verify worker types are committed and current
              working-directory: ${{ github.workspace }}
              run: |
                  git add --intent-to-add -- '**/worker-configuration.d.ts'
                  git diff --exit-code -- '**/worker-configuration.d.ts'
