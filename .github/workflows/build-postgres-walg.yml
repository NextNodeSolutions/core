name: Build postgres+wal-g image

# Fleet base image: postgres:18 with WAL-G baked in for continuous WAL archiving
# + PITR to R2. Built once here and consumed by reference from the deploy compose
# (production embedded postgres). Same consumption model as the upstream backup
# sidecar - rebuilt only when the image sources change, not per app deploy.

on:
    push:
        branches: [main]
        paths:
            - 'images/postgres-walg/**'
            - '.github/workflows/build-postgres-walg.yml'
    workflow_dispatch:

permissions:
    contents: read
    packages: write

env:
    # Keep this major in lockstep with NEXTNODE_POSTGRES_VERSION in
    # packages/infrastructure/src/domain/services/postgres.ts.
    POSTGRES_MAJOR: '18'
    IMAGE: ghcr.io/nextnodesolutions/postgres-walg

jobs:
    build:
        name: Build and push
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: images/postgres-walg
                  platforms: linux/amd64
                  push: true
                  build-args: |
                      POSTGRES_VERSION=${{ env.POSTGRES_MAJOR }}
                  tags: |
                      ${{ env.IMAGE }}:${{ env.POSTGRES_MAJOR }}
                      ${{ env.IMAGE }}:${{ env.POSTGRES_MAJOR }}-${{ github.sha }}
