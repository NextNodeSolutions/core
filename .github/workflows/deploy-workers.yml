name: Deploy Workers

on:
    workflow_call:
        inputs:
            environment:
                type: string
                required: true
                description: 'development or production'
            config_file:
                type: string
                default: 'nextnode.toml'
                description: 'Path to nextnode.toml in the calling repo'
            dev_workflow_file:
                type: string
                default: 'deploy-dev.yml'
                description: 'Filename of the dev workflow (for prod gate)'

permissions:
    contents: read
    actions: read

env:
    # Infisical machine identity the pipeline logs in as through GitHub OIDC -
    # the vault holds every secret, GitHub none. Org-level Variable (an id, not
    # a credential).
    INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}

# Serialise deploys per (config, environment). Two pushes to the same
# project's environment queue rather than racing - protects the shared
# Terraform workspace state and the D1 migration roundtrip from concurrent
# runs (Terraform holds its own lock, but serialising here avoids a run
# failing on a held lock instead of queueing).
concurrency:
    group: deploy-${{ inputs.config_file }}-${{ inputs.environment }}
    cancel-in-progress: false

jobs:
    plan:
        name: Plan
        runs-on: ubuntu-latest
        outputs:
            quality_matrix: ${{ steps.plan.outputs.quality_matrix }}
            project_name: ${{ steps.plan.outputs.project_name }}
            has_prod_gate: ${{ steps.plan.outputs.has_prod_gate }}
            has_domain: ${{ steps.plan.outputs.has_domain }}
            has_d1: ${{ steps.plan.outputs.has_d1 }}
            package_dir: ${{ steps.plan.outputs.package_dir }}
        steps:
            - uses: NextNodeSolutions/core/.github/actions/setup@main
              with:
                  infra: 'true'
                  deps: 'false'

            - name: Plan pipeline
              id: plan
              run: node src/index.ts plan
              working-directory: .infra/packages/infrastructure
              env:
                  PIPELINE_CONFIG_FILE: ${{ github.workspace }}/${{ inputs.config_file }}
                  PIPELINE_ENVIRONMENT: ${{ inputs.environment }}

    check-secrets:
        name: Check secrets
        needs: plan
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: read
            id-token: write
        # `environment:` is only still here for the transitional seed step: it is
        # what makes GitHub put the env-scoped secrets in the snapshot that step
        # copies. The check itself reads the vault.
        environment:
            name: ${{ inputs.environment }}
        steps:
            - uses: NextNodeSolutions/core/.github/actions/setup@main
              with:
                  infra: 'true'
                  deps: 'false'

            # TRANSITIONAL (packages/infrastructure/MIGRATION.md): copy the GitHub
            # secrets this pipeline still relies on into the vault, once. Goes
            # away with the GitHub secrets.
            - name: Seed vault from GitHub secrets
              run: node src/index.ts seed-vault
              working-directory: .infra/packages/infrastructure
              env:
                  PIPELINE_CONFIG_FILE: ${{ github.workspace }}/${{ inputs.config_file }}
                  PIPELINE_ENVIRONMENT: ${{ inputs.environment }}
                  LEGACY_GITHUB_SECRETS: ${{ toJSON(secrets) }}

            - name: Load secrets
              id: vault
              run: node src/index.ts load-secrets
              working-directory: .infra/packages/infrastructure
              env:
                  PIPELINE_ENVIRONMENT: ${{ inputs.environment }}

            - name: Check declared secrets
              run: node src/index.ts check-secrets
              working-directory: .infra/packages/infrastructure
              env:
                  PIPELINE_CONFIG_FILE: ${{ github.workspace }}/${{ inputs.config_file }}
                  PIPELINE_ENVIRONMENT: ${{ inputs.environment }}
                  ALL_SECRETS: ${{ steps.vault.outputs.ALL_SECRETS }}

    quality:
        name: ${{ matrix.task.name }}
        needs: plan
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                task: ${{ fromJSON(needs.plan.outputs.quality_matrix) }}
        steps:
            - uses: NextNodeSolutions/core/.github/actions/setup@main
              with:
                  infra: ${{ needs.plan.outputs.has_prod_gate }}

            - name: ${{ matrix.task.name }}
              run: ${{ matrix.task.cmd }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  DEV_WORKFLOW_FILE: ${{ inputs.dev_workflow_file }}

    provision:
        name: Provision
        needs: [plan, quality, check-secrets]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: read
            id-token: write
        # `ensureGeneratedSecrets` skips regeneration only when the secret is
        # already present in `ALL_SECRETS`, so provision must load the project's
        # pool - otherwise it regenerates and re-stores every generated secret
        # on every provision, rotating e.g. BETTER_AUTH_SECRET and invalidating
        # live sessions (the opposite of the idempotent, non-rotating contract
        # `ensureGeneratedSecrets` documents).
        environment:
            name: ${{ inputs.environment }}
        steps:
            - uses: NextNodeSolutions/core/.github/actions/setup@main
              with:
                  infra: 'true'
                  deps: 'false'

            - name: Load secrets
              id: vault
              run: node src/index.ts load-secrets
              working-directory: .infra/packages/infrastructure
              env:
                  PIPELINE_ENVIRONMENT: ${{ inputs.environment }}

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: '~> 1.9'
                  terraform_wrapper: false

            - name: Provision infrastructure
              id: provision
              run: node src/index.ts provision
              working-directory: .infra/packages/infrastructure
              env:
                  PIPELINE_CONFIG_FILE: ${{ github.workspace }}/${{ inputs.config_file }}
                  PIPELINE_ENVIRONMENT: ${{ inputs.environment }}
                  CLOUDFLARE_API_TOKEN: ${{ steps.vault.outputs.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ steps.vault.outputs.CLOUDFLARE_ACCOUNT_ID }}
                  TF_TOKEN_app_terraform_io: ${{ steps.vault.outputs.TF_CLOUD_TOKEN }}
                  # Lets ensureGeneratedSecrets see already-generated secrets
                  # and skip regeneration (idempotent, non-rotating).
                  ALL_SECRETS: ${{ steps.vault.outputs.ALL_SECRETS }}

    migrate:
        name: Migrate
        needs: [plan, provision]
        # Applies pending D1 migrations whenever the project declares
        # `[services.d1]`. `wrangler d1 migrations apply --remote` is idempotent -
        # it lists the remote `d1_migrations` table and applies only what is
        # pending, so running it every deploy is a no-op when the schema is
        # current. No git-diff gating: the deployed D1 (which a provision can
        # recreate empty) is the source of truth, not the push's file diff.
        if: ${{ !cancelled() && !failure() && needs.plan.outputs.has_d1 == 'true' }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: read
            id-token: write
        # migrate-remote resolves the deploy context (resolveDeployContext reads
        # ALL_SECRETS for the per-service secret pool) exactly like deploy, so it
        # loads the project's pool from the vault like deploy does.
        environment:
            name: ${{ inputs.environment }}
        steps:
            - uses: NextNodeSolutions/core/.github/actions/setup@main
              with:
                  infra: 'true'
                  deps: 'false'

            - name: Load secrets
              id: vault
              run: node src/index.ts load-secrets
              working-directory: .infra/packages/infrastructure
              env:
                  PIPELINE_ENVIRONMENT: ${{ inputs.environment }}

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: '~> 1.9'
                  terraform_wrapper: false

            - name: Migrate remote
              run: node src/index.ts migrate-remote
              working-directory: .infra/packages/infrastructure
              env:
                  PIPELINE_CONFIG_FILE: ${{ github.workspace }}/${{ inputs.config_file }}
                  PIPELINE_ENVIRONMENT: ${{ inputs.environment }}
                  CLOUDFLARE_API_TOKEN: ${{ steps.vault.outputs.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ steps.vault.outputs.CLOUDFLARE_ACCOUNT_ID }}
                  TF_TOKEN_app_terraform_io: ${{ steps.vault.outputs.TF_CLOUD_TOKEN }}
                  ALL_SECRETS: ${{ steps.vault.outputs.ALL_SECRETS }}

    deploy:
        name: Deploy
        needs: [plan, quality, provision, migrate]
        if: ${{ !cancelled() && !failure() }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: read
            id-token: write
        environment:
            name: ${{ inputs.environment }}
        steps:
            - uses: NextNodeSolutions/core/.github/actions/setup@main
              with:
                  infra: 'true'
                  # deps left at its default 'true' - the caller's site builds
                  # here (pnpm build) before `wrangler deploy` uploads the bundle.

            - name: Load secrets
              id: vault
              run: node src/index.ts load-secrets
              working-directory: .infra/packages/infrastructure
              env:
                  PIPELINE_ENVIRONMENT: ${{ inputs.environment }}

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: '~> 1.9'
                  terraform_wrapper: false

            - name: Build
              run: pnpm build

            # The SEO guard is injected per service inside `deploy` (before each
            # asset upload), so there is no separate seo-guard step here.
            - name: Deploy
              run: node src/index.ts deploy
              working-directory: .infra/packages/infrastructure
              env:
                  PIPELINE_CONFIG_FILE: ${{ github.workspace }}/${{ inputs.config_file }}
                  PIPELINE_ENVIRONMENT: ${{ inputs.environment }}
                  CLOUDFLARE_API_TOKEN: ${{ steps.vault.outputs.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ steps.vault.outputs.CLOUDFLARE_ACCOUNT_ID }}
                  TF_TOKEN_app_terraform_io: ${{ steps.vault.outputs.TF_CLOUD_TOKEN }}
                  ALL_SECRETS: ${{ steps.vault.outputs.ALL_SECRETS }}
