name: Cut over landing dev from Pages

on:
    workflow_dispatch:
        inputs:
            confirm_hostname:
                type: string
                required: true
                description: 'Type dev.nextnode.fr to confirm this dev-only cutover'
            operation:
                type: choice
                required: true
                default: cutover
                options:
                    - cutover
                    - restore
            snapshot_run:
                type: string
                description: 'For restore only: the prior cutover workflow run ID'

permissions:
    contents: read
    actions: read
    id-token: write

concurrency:
    group: landing-dev-pages-cutover
    cancel-in-progress: false

env:
    INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
    INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}

jobs:
    cutover:
        if: github.repository == 'NextNodeSolutions/core' && github.ref == 'refs/heads/ops/landing-dev-pages-cutover'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Confirm the dev hostname
              env:
                  CONFIRM_HOSTNAME: ${{ inputs.confirm_hostname }}
              run: test "$CONFIRM_HOSTNAME" = dev.nextnode.fr

            - uses: NextNodeSolutions/core/.github/actions/setup@main
              with:
                  infra: 'true'
                  deps: 'false'

            - name: Load platform credentials
              id: vault
              run: node src/index.ts load-secrets
              working-directory: .infra/packages/infrastructure

            - name: Capture the existing DNS and Pages domain
              if: inputs.operation == 'cutover'
              run: python3 .github/scripts/landing-dev-cutover.py capture
              env:
                  CLOUDFLARE_ACCOUNT_ID: ${{ steps.vault.outputs.CLOUDFLARE_ACCOUNT_ID }}
                  CLOUDFLARE_API_TOKEN: ${{ steps.vault.outputs.CLOUDFLARE_API_TOKEN }}

            - name: Preserve the snapshot before any mutation
              if: inputs.operation == 'cutover'
              uses: actions/upload-artifact@v7
              with:
                  name: landing-dev-cutover-before
                  path: landing-dev-cutover-before.json
                  if-no-files-found: error
                  retention-days: 7

            - name: Download the original snapshot for restore
              if: inputs.operation == 'restore'
              uses: actions/download-artifact@v8
              with:
                  name: landing-dev-cutover-before
                  run-id: ${{ inputs.snapshot_run }}
                  github-token: ${{ github.token }}

            - name: Cut over the dev hostname
              id: cutover
              if: inputs.operation == 'cutover'
              run: python3 .github/scripts/landing-dev-cutover.py cutover
              env:
                  CLOUDFLARE_ACCOUNT_ID: ${{ steps.vault.outputs.CLOUDFLARE_ACCOUNT_ID }}
                  CLOUDFLARE_API_TOKEN: ${{ steps.vault.outputs.CLOUDFLARE_API_TOKEN }}

            - name: Restore the previous routing if cutover failed
              if: failure() && steps.cutover.outcome == 'failure'
              run: python3 .github/scripts/landing-dev-cutover.py recover
              env:
                  CLOUDFLARE_ACCOUNT_ID: ${{ steps.vault.outputs.CLOUDFLARE_ACCOUNT_ID }}
                  CLOUDFLARE_API_TOKEN: ${{ steps.vault.outputs.CLOUDFLARE_API_TOKEN }}

            - name: Restore the previous routing on request
              if: inputs.operation == 'restore'
              run: python3 .github/scripts/landing-dev-cutover.py restore
              env:
                  CLOUDFLARE_ACCOUNT_ID: ${{ steps.vault.outputs.CLOUDFLARE_ACCOUNT_ID }}
                  CLOUDFLARE_API_TOKEN: ${{ steps.vault.outputs.CLOUDFLARE_API_TOKEN }}
