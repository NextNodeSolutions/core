name: Build Golden Image

on:
    push:
        branches: [main]
        paths:
            - 'packages/infrastructure/src/domain/hetzner/golden-image.ts'
            - 'packages/infrastructure/src/adapters/hetzner/provision/build-golden-image.ts'
            - 'packages/infrastructure/src/cli/hetzner/build-golden-image.command.ts'
    workflow_dispatch:

permissions:
    contents: read
    id-token: write

env:
    # Infisical machine identity the pipeline logs in as through GitHub OIDC -
    # the vault holds every secret, GitHub none. Org-level Variable (an id, not
    # a credential).
    INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}

jobs:
    build:
        name: Build golden image
        runs-on: ubuntu-latest
        steps:
            - uses: NextNodeSolutions/core/.github/actions/setup@main
              with:
                  infra: 'true'
                  deps: 'false'

            - name: Load secrets
              id: vault
              run: node src/index.ts load-secrets
              working-directory: .infra/packages/infrastructure

            - name: Build golden image
              run: node src/index.ts build-golden-image
              working-directory: .infra/packages/infrastructure
              env:
                  HETZNER_API_TOKEN: ${{ steps.vault.outputs.HETZNER_API_TOKEN }}
