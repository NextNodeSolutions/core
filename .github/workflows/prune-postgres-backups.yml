name: Prune Postgres Backups

# Daily grandfather-father-son prune of every project's pg_dump backup bucket
# (`<project>-backups-dump`). Enumerates the fleet from the R2 state files, so
# it needs no per-project config and no VPS access - the prune is a pure R2
# list+delete with the infra credentials. wal-g manages its own bucket's
# retention independently and is untouched here.

on:
    schedule:
        # 04:17 UTC daily - off the top of the hour to dodge cron congestion.
        - cron: '17 4 * * *'
    workflow_dispatch:

permissions:
    contents: read
    id-token: write

env:
    # Infisical machine identity the pipeline logs in as through GitHub OIDC -
    # the vault holds every secret, GitHub none. Org-level Variable (an id, not
    # a credential).
    INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}

jobs:
    prune:
        name: Prune pg_dump backups (GFS)
        runs-on: ubuntu-latest
        steps:
            - uses: NextNodeSolutions/core/.github/actions/setup@main
              with:
                  infra: 'true'
                  deps: 'false'

            - name: Load secrets
              id: vault
              run: node src/index.ts load-secrets
              working-directory: .infra/packages/infrastructure

            - name: Prune postgres backups
              run: node src/index.ts prune-backups
              working-directory: .infra/packages/infrastructure
              env:
                  CLOUDFLARE_API_TOKEN: ${{ steps.vault.outputs.CLOUDFLARE_API_TOKEN }}
                  R2_ACCESS_KEY_ID: ${{ steps.vault.outputs.R2_ACCESS_KEY_ID }}
                  R2_SECRET_ACCESS_KEY: ${{ steps.vault.outputs.R2_SECRET_ACCESS_KEY }}
