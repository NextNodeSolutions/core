name: Move platform secrets to root

on:
    workflow_dispatch:

permissions:
    contents: read
    id-token: write

concurrency:
    group: move-platform-secrets
    cancel-in-progress: false

env:
    INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
    INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}

jobs:
    move:
        if: github.repository == 'NextNodeSolutions/core' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: NextNodeSolutions/core/.github/actions/setup@main
              with:
                  infra: 'true'
                  deps: 'false'

            - name: Move and verify platform secrets
              run: node src/cli/vault/move-platform-secrets.ts
              working-directory: .infra/packages/infrastructure
