name: Deploy Static

on:
    workflow_call:
        inputs:
            environment:
                type: string
                required: true
                description: 'development or production'
            config_file:
                type: string
                default: 'nextnode.toml'
                description: 'Path to nextnode.toml in the calling repo'
            dev_workflow_file:
                type: string
                default: 'deploy-dev.yml'
                description: 'Filename of the dev workflow (for prod gate)'

permissions:
    contents: read
    actions: read

env:
    # Infisical machine identity the pipeline logs in as through GitHub OIDC -
    # the vault holds every secret, GitHub none. Org-level Variable (an id, not
    # a credential).
    INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}

jobs:
    plan:
        name: Plan
        runs-on: ubuntu-latest
        outputs:
            quality_matrix: ${{ steps.plan.outputs.quality_matrix }}
            project_name: ${{ steps.plan.outputs.project_name }}
            has_prod_gate: ${{ steps.plan.outputs.has_prod_gate }}
            has_domain: ${{ steps.plan.outputs.has_domain }}
            build_directory: ${{ steps.plan.outputs.build_directory }}
        steps:
            - uses: NextNodeSolutions/core/.github/actions/setup@main
              with:
                  infra: 'true'
                  deps: 'false'

            - name: Plan pipeline
              id: plan
              run: node src/index.ts plan
              working-directory: .infra/packages/infrastructure
              env:
                  PIPELINE_CONFIG_FILE: ${{ github.workspace }}/${{ inputs.config_file }}
                  PIPELINE_ENVIRONMENT: ${{ inputs.environment }}

    check-secrets:
        name: Check secrets
        needs: plan
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: read
            id-token: write
        # `environment:` is only still here for the transitional seed step: it is
        # what makes GitHub put the env-scoped secrets in the snapshot that step
        # copies. The check itself reads the vault.
        environment:
            name: ${{ inputs.environment }}
        steps:
            - uses: NextNodeSolutions/core/.github/actions/setup@main
              with:
                  infra: 'true'
                  deps: 'false'

            # TRANSITIONAL (packages/infrastructure/MIGRATION.md): copy the GitHub
            # secrets this pipeline still relies on into the vault, once. Goes
            # away with the GitHub secrets.
            - name: Seed vault from GitHub secrets
              run: node src/index.ts seed-vault
              working-directory: .infra/packages/infrastructure
              env:
                  PIPELINE_CONFIG_FILE: ${{ github.workspace }}/${{ inputs.config_file }}
                  PIPELINE_ENVIRONMENT: ${{ inputs.environment }}
                  LEGACY_GITHUB_SECRETS: ${{ toJSON(secrets) }}

            - name: Load secrets
              id: vault
              run: node src/index.ts load-secrets
              working-directory: .infra/packages/infrastructure
              env:
                  PIPELINE_ENVIRONMENT: ${{ inputs.environment }}

            - name: Check declared secrets
              run: node src/index.ts check-secrets
              working-directory: .infra/packages/infrastructure
              env:
                  PIPELINE_CONFIG_FILE: ${{ github.workspace }}/${{ inputs.config_file }}
                  PIPELINE_ENVIRONMENT: ${{ inputs.environment }}
                  ALL_SECRETS: ${{ steps.vault.outputs.ALL_SECRETS }}

    quality:
        name: ${{ matrix.task.name }}
        needs: plan
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                task: ${{ fromJSON(needs.plan.outputs.quality_matrix) }}
        steps:
            - uses: NextNodeSolutions/core/.github/actions/setup@main
              with:
                  infra: ${{ needs.plan.outputs.has_prod_gate }}

            - name: ${{ matrix.task.name }}
              run: ${{ matrix.task.cmd }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  DEV_WORKFLOW_FILE: ${{ inputs.dev_workflow_file }}

    provision:
        name: Provision
        needs: [plan, check-secrets]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: read
            id-token: write
        steps:
            - uses: NextNodeSolutions/core/.github/actions/setup@main
              with:
                  infra: 'true'
                  deps: 'false'

            - name: Load secrets
              id: vault
              run: node src/index.ts load-secrets
              working-directory: .infra/packages/infrastructure

            - name: Provision infrastructure
              run: node src/index.ts provision
              working-directory: .infra/packages/infrastructure
              env:
                  PIPELINE_CONFIG_FILE: ${{ github.workspace }}/${{ inputs.config_file }}
                  PIPELINE_ENVIRONMENT: ${{ inputs.environment }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ steps.vault.outputs.CLOUDFLARE_ACCOUNT_ID }}
                  CLOUDFLARE_API_TOKEN: ${{ steps.vault.outputs.CLOUDFLARE_API_TOKEN }}

    dns:
        name: DNS
        needs: [plan, provision]
        if: needs.plan.outputs.has_domain == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: read
            id-token: write
        steps:
            - uses: NextNodeSolutions/core/.github/actions/setup@main
              with:
                  infra: 'true'
                  deps: 'false'

            - name: Load secrets
              id: vault
              run: node src/index.ts load-secrets
              working-directory: .infra/packages/infrastructure

            - name: Reconcile DNS
              run: node src/index.ts dns
              working-directory: .infra/packages/infrastructure
              env:
                  PIPELINE_CONFIG_FILE: ${{ github.workspace }}/${{ inputs.config_file }}
                  PIPELINE_ENVIRONMENT: ${{ inputs.environment }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ steps.vault.outputs.CLOUDFLARE_ACCOUNT_ID }}
                  CLOUDFLARE_API_TOKEN: ${{ steps.vault.outputs.CLOUDFLARE_API_TOKEN }}

    deploy:
        name: Deploy
        needs: [plan, quality, provision]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: read
            id-token: write
        environment:
            name: ${{ inputs.environment }}
            url: ${{ steps.cf.outputs.url }}
        steps:
            - uses: NextNodeSolutions/core/.github/actions/setup@main
              with:
                  infra: 'true'

            - name: Load secrets
              id: vault
              run: node src/index.ts load-secrets
              working-directory: .infra/packages/infrastructure
              env:
                  PIPELINE_ENVIRONMENT: ${{ inputs.environment }}

            - name: Deploy
              run: node src/index.ts deploy
              working-directory: .infra/packages/infrastructure
              env:
                  PIPELINE_CONFIG_FILE: ${{ github.workspace }}/${{ inputs.config_file }}
                  PIPELINE_ENVIRONMENT: ${{ inputs.environment }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ steps.vault.outputs.CLOUDFLARE_ACCOUNT_ID }}
                  CLOUDFLARE_API_TOKEN: ${{ steps.vault.outputs.CLOUDFLARE_API_TOKEN }}
                  ALL_SECRETS: ${{ steps.vault.outputs.ALL_SECRETS }}

            - name: Build
              run: pnpm build

            - name: SEO guard
              run: node src/index.ts seo-guard
              working-directory: .infra/packages/infrastructure
              env:
                  PIPELINE_CONFIG_FILE: ${{ github.workspace }}/${{ inputs.config_file }}
                  PIPELINE_ENVIRONMENT: ${{ inputs.environment }}
                  BUILD_DIRECTORY: ${{ github.workspace }}/${{ needs.plan.outputs.build_directory }}

            - uses: NextNodeSolutions/core/.github/actions/deploy-cloudflare-pages@main
              id: cf
              with:
                  directory: ${{ needs.plan.outputs.build_directory }}
                  project-name: ${{ needs.plan.outputs.project_name }}
                  account-id: ${{ steps.vault.outputs.CLOUDFLARE_ACCOUNT_ID }}
                  api-token: ${{ steps.vault.outputs.CLOUDFLARE_API_TOKEN }}
