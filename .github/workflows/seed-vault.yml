name: Seed Vault

# TRANSITIONAL - delete with the `seed-vault` commands once the GitHub secrets
# are removed (packages/infrastructure/README.md, "Secrets").
#
# One-shot copy of the platform credentials from the GitHub secrets into the
# Infisical vault, run manually right after the vault migration lands, so that
# core's own workflows (publish, teardown, plan diff) can read them. Consumer
# repos seed their project secrets from the `check-secrets` job of their next
# deploy. Idempotent: a secret the vault already holds is skipped.

on:
    workflow_dispatch:

permissions:
    contents: read
    id-token: write

env:
    # Infisical machine identity the pipeline logs in as through GitHub OIDC -
    # the vault holds every secret, GitHub none. Org-level Variable (an id, not
    # a credential).
    INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}

jobs:
    seed:
        name: Seed vault from GitHub secrets
        runs-on: ubuntu-latest
        timeout-minutes: 30
        # Puts the secrets scoped to core's `production` environment in
        # `toJSON(secrets)`, next to the org-level ones.
        environment:
            name: production
        steps:
            - uses: NextNodeSolutions/core/.github/actions/setup@main
              with:
                  infra: 'true'
                  deps: 'false'

            - name: Seed platform secrets
              run: node src/index.ts seed-platform-secrets
              working-directory: .infra/packages/infrastructure
              env:
                  LEGACY_GITHUB_SECRETS: ${{ toJSON(secrets) }}
