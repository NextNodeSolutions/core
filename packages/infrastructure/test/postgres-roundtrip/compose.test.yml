# Integration-test compose stack for the postgres dump -> R2 -> restore
# round-trip. Mirrors what `buildPostgresBackupSidecar` produces in
# production, with MinIO standing in for R2.
services:
    postgres:
        image: postgres:18
        environment:
            POSTGRES_USER: app
            POSTGRES_DB: app
            POSTGRES_PASSWORD: app
        ports:
            - '5433:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U app -d app']
            interval: 5s
            timeout: 3s
            retries: 10

    minio:
        image: minio/minio
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: minioadmin
            MINIO_ROOT_PASSWORD: minioadmin
        ports:
            - '9100:9000'
        healthcheck:
            test: ['CMD-SHELL', 'mc ready local || exit 1']
            interval: 5s
            timeout: 3s
            retries: 10

    postgres-backup:
        image: ghcr.io/solectrus/postgres-s3-backup:18
        depends_on:
            postgres:
                condition: service_healthy
            minio:
                condition: service_healthy
        environment:
            SCHEDULE: '@daily'
            BACKUP_KEEP_DAYS: '0'
            S3_REGION: auto
            S3_S3V4: 'yes'
            S3_PREFIX: postgres
            S3_ENDPOINT: http://minio:9000
            S3_BUCKET: nn-backups-test
            S3_ACCESS_KEY_ID: minioadmin
            S3_SECRET_ACCESS_KEY: minioadmin
            POSTGRES_HOST: postgres
            POSTGRES_DATABASE: app
            POSTGRES_USER: app
            POSTGRES_PASSWORD: app
