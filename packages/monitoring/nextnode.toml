[project]
name = "monitoring"
type = "app"
internal = true
domain = "monitoring.nextnode.fr"
filter = "@nextnode-solutions/monitoring"

[deploy]
vps = "nn-internals"
# Global secret pool: consumed at deploy time by the observability config
# renderers (Alertmanager email routing) - never by the app runtime.
# HEALTHCHECKS_PING_URL (the external dead man's switch heartbeat) is
# deliberately NOT listed: it is optional (the renderer omits the DMS route when
# absent, email alerting still works). Re-add it here + set the GitHub secret
# once a healthchecks.io check exists to turn the dead man's switch back on.
secrets = ["RESEND_API_KEY"]

[deploy.hetzner]
server_type = "cx33"
location = "nbg1"

# Single build service. Defaults reconstruct the monorepo build: context = repo
# root, dockerfile = packages/monitoring/Dockerfile, final Dockerfile stage,
# port 3000. nextnode.toml is the single source of truth — no docker-compose.yml.
# `url` claims the bare project domain so the service is routed: with
# internal = true it gets a tailnet-IP A-record, an internal-cert Caddy upstream,
# and a published host port forwarding to the container's :3000.
# `secrets` are declared PER SERVICE (no deploy-wide pool): the runtime pulls
# exactly these names from GitHub Secrets into this service's .env — least
# privilege, so a sibling service never sees them.
[deploy.services.app]
source = "build"
url = "monitoring.nextnode.fr"
secrets = [
	"CLOUDFLARE_API_TOKEN",
	"CLOUDFLARE_ACCOUNT_ID",
	"HETZNER_API_TOKEN",
	"TS_OAUTH_SECRET",
	# Read-only access to the nextnode-state bucket: the /api/sd/* service
	# discovery endpoints join tailnet devices with hetzner/<vps>.json.
	"R2_ACCESS_KEY_ID",
	"R2_SECRET_ACCESS_KEY",
]

# The self-hosted observability backend (PRD monitoring-vps, option A):
# VictoriaLogs + VictoriaMetrics + vmagent + vmalert x2 + Alertmanager +
# blackbox_exporter, injected into the generated compose file by the
# infrastructure pipeline. The vhosts resolve to the tailnet IP
# (internal = true): logs.* is the fleet-wide NN_VL_URL Vector pushes to,
# metrics.* serves vmui for ad-hoc exploration.
[services.observability]
logs_retention = "30d"
metrics_retention_months = 12
logs_vhost = "logs.monitoring.nextnode.fr"
metrics_vhost = "metrics.monitoring.nextnode.fr"

[environment]
development = false
